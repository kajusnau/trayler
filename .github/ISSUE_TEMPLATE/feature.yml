name: Feature request
description: Suggest a change or a new feature
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What you are trying to do, and why trayler does not cover it today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How it should work; a config or command-line example helps
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
