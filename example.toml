# trayler config. Run it with: trayler --config trayler.toml [--pid PID | -- COMMAND]
# Flags on the command line override the values here.

# Icon theme name of the tray icon.
icon = "media-record-symbolic"

# Title and tooltip of the icon. Default: "trayler".
title = "trayler"

# The last menu entry. With --pid or a command after --, it sends `signal` to
# that process; otherwise it closes trayler.
[exit]
label = "Exit"
# Printed to stdout when this entry ends the session.
# id = "exit"
# TERM (default), INT, HUP, QUIT, KILL, USR1 or USR2. Only with --pid or a command.
# signal = "INT"

# Menu entries, listed top to bottom as they are written here.
# `type` is "button" (the default), "toggle", "label" or "separator".

# A button runs `command` with `sh -c`. `icon` is optional. `id` names an entry
# for the output of trayler and for `exit = true`.
[[entry]]
label = "Open Videos"
icon = "folder-videos-symbolic"
command = "xdg-open ~/Videos"

[[entry]]
type = "separator"

# A label is a line of text that cannot be clicked.
[[entry]]
type = "label"
label = "Recording"

# A toggle is a checkbox. Each click runs `command` with "on" or "off" as $1.
# `checked` (default false) is the starting state. `label_checked` and
# `icon_checked` replace `label` and `icon` while it is checked.
[[entry]]
type = "toggle"
label = "Do not disturb"
label_checked = "Do not disturb (on)"
icon_checked = "notifications-disabled-symbolic"
checked = false
command = "notify-send \"Do not disturb: $1\""

# With `exit = true` a button runs its command, then ends the session like Exit
# does. It needs an `id`, which is printed to stdout.
[[entry]]
id = "discard"
label = "Discard"
exit = true
command = "notify-send Discarded"
