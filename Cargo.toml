[package]
name = "trayler"
version = "0.1.0"
edition = "2021"
description = "A configurable tray icon and menu for any process"
license = "GPL-3.0-or-later"
authors = ["Kajus Naujokaitis"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
ksni = "0.3.3"
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "net", "process", "signal", "sync"] }
toml = "1"
